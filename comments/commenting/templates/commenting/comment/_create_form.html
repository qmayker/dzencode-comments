<section class="comment-create {{ form_class }}" aria-labelledby="{{ title_id }}">
  <h2 id="{{ title_id }}">{{ title }}</h2>
  <form id="{{ form_id }}" data-api-form="comment-create">
    {% for field in form %}
      <div class="form-field{% if field.name == 'text' %} form-field-comment{% endif %}">
        {{ field.label_tag }}
        {{ field }}
        {% for error in field.errors %}
          <p class="form-error">{{ error }}</p>
        {% endfor %}
      </div>
    {% endfor %}
    <button type="submit">Надіслати коментар</button>
    <p id="{{ status_id }}" role="status" aria-live="polite"></p>
  </form>
</section>
