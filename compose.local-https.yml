services:
  web:
    environment:
      ALLOWED_HOSTS: "${ALLOWED_HOSTS},localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-},https://localhost"

  daphne:
    environment:
      ALLOWED_HOSTS: "${ALLOWED_HOSTS},localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-},https://localhost"

  nginx-https:
    image: nginx:stable-alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/local-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/localhost.crt:/etc/nginx/certs/localhost.crt:ro
      - ./certs/localhost.key:/etc/nginx/certs/localhost.key:ro
      - staticfiles:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
      daphne:
        condition: service_started
    restart: unless-stopped
