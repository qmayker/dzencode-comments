services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn --bind 0.0.0.0:8000 --workers 3
      --access-logfile - --error-logfile - comments.wsgi:application"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-comments}
      DB_USER: ${DB_USER:-comments}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CHANNEL_REDIS_URL: redis://redis:6379/2
      EVENTS_REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/0
      LOG_FILE: /app/logs/web.log
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; hosts=os.environ['ALLOWED_HOSTS'].split(','); host=next((value.strip().lstrip('.') for value in hosts if value.strip() and value.strip() != '*'), 'localhost'); request=urllib.request.Request('http://127.0.0.1:8000/admin/login/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  daphne:
    build:
      context: .
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8001 comments.asgi:application
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-comments}
      DB_USER: ${DB_USER:-comments}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CHANNEL_REDIS_URL: redis://redis:6379/2
      EVENTS_REDIS_URL: redis://redis:6379/3
      CELERY_BROKER_URL: redis://redis:6379/0
      LOG_FILE: /app/logs/daphne.log
    volumes:
      - media:/app/media
      - logs:/app/logs
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-comments}
      POSTGRES_USER: ${DB_USER:-comments}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
      daphne:
        condition: service_started
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A comments worker --loglevel=debug
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-comments}
      DB_USER: ${DB_USER:-comments}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/1
      CHANNEL_REDIS_URL: redis://redis:6379/2
      EVENTS_REDIS_URL: redis://redis:6379/3
      LOG_FILE: /app/logs/celery.log
    volumes:
      - logs:/app/logs
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  events:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py listen_events
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-comments}
      DB_USER: ${DB_USER:-comments}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CHANNEL_REDIS_URL: redis://redis:6379/2
      EVENTS_REDIS_URL: redis://redis:6379/3
      REDIS_URL: redis://redis:6379/1
      LOG_FILE: /app/logs/events.log
    volumes:
      - logs:/app/logs
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media:
  staticfiles:
  logs: